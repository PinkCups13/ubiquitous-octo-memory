<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Savers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <div class="logo">
          <span class="logo-sun">☀️</span>
          <h1>Morning Savers</h1>
        </div>
        <div class="header-meta">
          <span id="today-label" class="day-badge"></span>
          <div class="session-progress">
            <span id="session-count">0/6</span>
            <span class="session-label">completed</span>
          </div>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div id="session-bar" class="progress-bar"></div>
      </div>
    </header>

    <main>
      <div class="intro-text">
        <p>Your daily <strong>SAVERS</strong> practice — choose a duration and begin.</p>
      </div>
      <div class="savers-grid" id="savers-grid"></div>
    </main>

    <!-- Timer Modal -->
    <div id="timer-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-card">
        <button class="modal-close" id="modal-close">✕</button>

        <div class="modal-header">
          <div class="modal-letter" id="modal-letter"></div>
          <div>
            <h2 id="modal-name"></h2>
            <p id="modal-day-title" class="modal-day-title"></p>
          </div>
        </div>

        <div class="modal-tabs">
          <button class="tab-btn active" data-tab="practice">Practice</button>
          <button class="tab-btn" data-tab="instructions">Instructions</button>
          <button class="tab-btn" data-tab="ideas">Ideas</button>
        </div>

        <div class="tab-content" id="tab-practice">
          <div class="duration-selector">
            <button class="dur-btn active" data-minutes="1">1 min</button>
            <button class="dur-btn" data-minutes="3">3 min</button>
            <button class="dur-btn" data-minutes="10">10 min</button>
          </div>

          <div class="timer-wrap">
            <svg class="timer-ring" viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88" />
              <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="88" />
            </svg>
            <div class="timer-center">
              <div id="timer-display" class="timer-display">1:00</div>
              <div id="timer-status" class="timer-status">Ready</div>
            </div>
          </div>

          <div class="timer-controls">
            <button id="btn-start" class="ctrl-btn primary">Start</button>
            <button id="btn-pause" class="ctrl-btn secondary hidden">Pause</button>
            <button id="btn-resume" class="ctrl-btn secondary hidden">Resume</button>
            <button id="btn-reset" class="ctrl-btn ghost hidden">Reset</button>
          </div>
        </div>

        <div class="tab-content hidden" id="tab-instructions">
          <div id="instructions-content" class="prose"></div>
        </div>

        <div class="tab-content hidden" id="tab-ideas">
          <div id="ideas-content" class="ideas-list"></div>
        </div>

        <div id="complete-banner" class="complete-banner hidden">
          <span class="complete-icon">✓</span>
          <span>Session complete! Great work.</span>
        </div>
      </div>
    </div>

    <footer>
      <p>Based on the <em>Miracle Morning</em> by Hal Elrod &nbsp;·&nbsp; <strong>SAVERS</strong> method</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
