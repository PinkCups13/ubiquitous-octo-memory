<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Savers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <div class="atmo" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <div id="app">

    <header class="hero">
      <div class="hero-inner">
        <div class="hero-eyebrow">
          <span id="today-label" class="day-label"></span>
          <span class="eyebrow-sep">—</span>
          <span class="eyebrow-tag">Miracle Morning</span>
        </div>
        <h1 class="hero-title">
          <span class="title-word">Morning</span>
          <span class="title-word title-word-2">Savers</span>
        </h1>
        <p class="hero-sub">Six practices. One sacred hour.</p>
        <div class="session-status">
          <div class="session-pips">
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
          </div>
          <span id="session-count" class="session-count-text">0 of 6 complete</span>
        </div>
      </div>
      <div class="hero-rule">
        <div id="session-bar" class="session-fill"></div>
      </div>
    </header>

    <main>
      <div id="savers-grid" class="savers-list"></div>
    </main>

    <!-- Timer Modal -->
    <div id="timer-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-card">
        <div class="modal-atmo" id="modal-atmo"></div>
        <button class="modal-close" id="modal-close" aria-label="Close">✕</button>

        <div class="modal-header">
          <div class="modal-letter" id="modal-letter"></div>
          <div class="modal-titles">
            <div class="modal-saver-name" id="modal-name"></div>
            <div class="modal-day-title" id="modal-day-title"></div>
          </div>
        </div>

        <div class="modal-tabs">
          <button class="tab-btn active" data-tab="practice">Practice</button>
          <button class="tab-btn" data-tab="instructions">Guide</button>
          <button class="tab-btn" data-tab="ideas">Ideas</button>
        </div>

        <div class="tab-content" id="tab-practice">
          <div class="duration-selector">
            <button class="dur-btn active" data-minutes="1">1 min</button>
            <button class="dur-btn" data-minutes="3">3 min</button>
            <button class="dur-btn" data-minutes="10">10 min</button>
          </div>

          <div class="timer-wrap">
            <svg class="timer-ring" viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88" />
              <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="88" />
            </svg>
            <div class="timer-center">
              <div id="timer-display" class="timer-display">1:00</div>
              <div id="timer-status" class="timer-status">Ready</div>
            </div>
          </div>

          <div class="timer-controls">
            <button id="btn-start"  class="ctrl-btn primary">Begin</button>
            <button id="btn-pause"  class="ctrl-btn secondary hidden">Pause</button>
            <button id="btn-resume" class="ctrl-btn secondary hidden">Resume</button>
            <button id="btn-reset"  class="ctrl-btn ghost hidden">Reset</button>
          </div>
        </div>

        <div class="tab-content hidden" id="tab-instructions">
          <div id="instructions-content" class="prose"></div>
        </div>

        <div class="tab-content hidden" id="tab-ideas">
          <div id="ideas-content" class="ideas-list"></div>
        </div>

        <div id="complete-banner" class="complete-banner hidden">
          <span class="complete-icon">✦</span>
          <span>Practice complete.</span>
        </div>
      </div>
    </div>

    <footer>
      <p>Based on <em>The Miracle Morning</em> by Hal Elrod &nbsp;·&nbsp; the <strong>SAVERS</strong> method</p>
    </footer>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
