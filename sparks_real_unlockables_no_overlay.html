<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SPARKS Morning Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-from: #fce4ec;
      --bg-mid:  #f8bbd0;
      --bg-to:   #ede7f6;
      --accent:  #c2577e;
      --accent2: #9c6fc0;
      --card-bg: rgba(255,255,255,0.72);
      --card-border: rgba(255,255,255,0.9);
      --card-shadow: 0 4px 24px rgba(194,87,126,.12),0 1px 4px rgba(0,0,0,.06);
      --text: #3d2040;
      --text-soft: #7a5a80;
      --text-muted: #b090b8;
      --gold: #d4a843;
      --gold-light: #f5d78e;
      --nav-bg: rgba(255,240,248,0.94);
      --radius: 18px;
      --safe-bot: env(safe-area-inset-bottom,0px);
    }
    .theme-lavender {
      --bg-from:#ede7f6; --bg-mid:#d1c4e9; --bg-to:#fce4ec;
      --accent:#8e4db0; --accent2:#c2577e;
      --text:#2d1840; --text-soft:#6a3d80; --nav-bg:rgba(237,231,246,.94);
    }
    .theme-vegas {
      --bg-from:#0a0015; --bg-mid:#0d0820; --bg-to:#15002a;
      --accent:#ff2d8a; --accent2:#b44fff;
      --card-bg:rgba(20,0,40,.75); --card-border:rgba(255,45,138,.2);
      --card-shadow:0 4px 24px rgba(255,45,138,.2),0 1px 4px rgba(0,0,0,.4);
      --text:#fce4ff; --text-soft:#d8a0f0; --text-muted:#8840a0;
      --gold:#ff9f1c; --gold-light:#ffc966; --nav-bg:rgba(10,0,25,.96);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;
      background:linear-gradient(160deg,var(--bg-from) 0%,var(--bg-mid) 50%,var(--bg-to) 100%);
      color:var(--text);overflow:hidden;user-select:none}
    #app{height:100dvh;display:flex;flex-direction:column;position:relative;
      max-width:480px;margin:0 auto;overflow:hidden}

    /* World overlays */
    #app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
      max-width:480px;margin:0 auto}
    .world-clouds #app::before{background:radial-gradient(ellipse 80% 40% at 20% 15%,rgba(255,255,255,.7) 0%,transparent 70%),
      radial-gradient(ellipse 60% 30% at 75% 25%,rgba(255,255,255,.55) 0%,transparent 70%)}
    .world-stars #app::before{background-image:radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1px);
      background-size:28px 28px;opacity:.25}
    .world-sunrise #app::before{background:linear-gradient(180deg,rgba(255,190,100,.4) 0%,transparent 50%)}
    .world-garden #app::before{background:radial-gradient(ellipse 50% 60% at 80% 90%,rgba(110,184,146,.4) 0%,transparent 60%),
      radial-gradient(ellipse 40% 50% at 10% 80%,rgba(110,184,146,.3) 0%,transparent 60%)}
    .world-cosmic #app::before{background:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(180,79,255,.3) 0%,transparent 70%),
      radial-gradient(ellipse 30% 20% at 20% 20%,rgba(255,45,138,.2) 0%,transparent 60%)}

    .screen{flex:1;overflow-y:auto;overflow-x:hidden;
      padding:16px 16px calc(80px + var(--safe-bot));
      display:none;position:relative;z-index:1;scroll-behavior:smooth}
    .screen.active{display:block}
    .screen::-webkit-scrollbar{display:none}

    /* Nav */
    #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;display:flex;
      background:var(--nav-bg);backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--card-border);
      padding-bottom:var(--safe-bot);z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:10px 4px 8px;background:none;border:none;cursor:pointer;
      color:var(--text-muted);font-family:'Nunito',sans-serif;
      font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:color .2s}
    .nav-btn.active{color:var(--accent)}
    .nav-icon{font-size:20px;line-height:1}

    /* Cards */
    .card{background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:var(--radius);box-shadow:var(--card-shadow);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent)}
    .card-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;
      color:var(--accent);margin-bottom:6px}
    .card-sub{font-size:11px;font-weight:700;color:var(--text-muted);
      letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}

    /* Today */
    .today-header{text-align:center;padding:20px 0 10px}
    .today-date{font-size:11px;font-weight:700;color:var(--text-muted);
      letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
    .today-title{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;
      color:var(--accent);line-height:1}
    .streak-badge{display:inline-flex;align-items:center;gap:4px;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:#5a3800;font-size:11px;font-weight:800;
      padding:3px 10px;border-radius:20px;margin-top:8px}

    /* Mood */
    .mood-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .mood-btn{background:rgba(255,255,255,.6);border:2px solid transparent;
      border-radius:12px;padding:8px 12px;cursor:pointer;font-size:20px;
      transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
    .mood-btn span{font-size:9px;font-weight:700;color:var(--text-soft);
      letter-spacing:.04em;text-transform:uppercase}
    .mood-btn.selected{border-color:var(--accent);background:rgba(255,255,255,.88);transform:scale(1.08)}

    .coaching-note{font-size:13px;font-style:italic;color:var(--text-soft);
      text-align:center;padding:6px 4px;line-height:1.6}

    /* Progress */
    .progress-wrap{background:rgba(0,0,0,.06);border-radius:99px;height:8px;
      overflow:hidden;margin:10px 0 6px}
    .progress-bar{height:100%;border-radius:99px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      transition:width .5s cubic-bezier(.34,1.56,.64,1);position:relative}
    .progress-bar::after{content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
      animation:shimmer 2s infinite}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    .progress-label{font-size:11px;font-weight:700;color:var(--text-muted);text-align:center}

    /* SPARKS grid */
    .sparks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
    .spark-tile{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:5px;cursor:pointer;
      border:2px solid transparent;transition:all .2s;position:relative;overflow:hidden}
    .spark-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;
      background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);
      border-radius:14px 14px 0 0;pointer-events:none}
    .spark-tile .spark-letter{font-family:'Cormorant Garamond',serif;font-size:32px;
      font-weight:600;line-height:1;color:white;text-shadow:0 2px 8px rgba(0,0,0,.2)}
    .spark-tile .spark-name{font-size:9px;font-weight:800;letter-spacing:.08em;
      text-transform:uppercase;color:rgba(255,255,255,.9)}
    .spark-tile.done{opacity:.7}
    .spark-tile.done::after{content:'✓';position:absolute;top:7px;right:9px;
      font-size:13px;color:white;font-weight:900}
    .spark-tile:active{transform:scale(.95)}

    /* Start card */
    .start-card{display:flex;align-items:center;gap:14px;cursor:pointer}
    .start-card:active{transform:scale(.98)}
    .start-icon{width:48px;height:48px;border-radius:14px;display:flex;
      align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
    .start-text{flex:1}
    .start-label{font-size:11px;font-weight:700;color:var(--text-muted);
      text-transform:uppercase;letter-spacing:.08em}
    .start-name{font-family:'Cormorant Garamond',serif;font-size:22px;
      font-weight:600;color:var(--accent)}
    .start-desc{font-size:12px;color:var(--text-soft);margin-top:2px}
    .start-arrow{color:var(--accent);font-size:20px}

    /* Intention */
    .intention-input{background:transparent;border:none;outline:none;
      font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;
      color:var(--text);width:100%;resize:none;min-height:42px;line-height:1.5}
    .intention-input::placeholder{color:var(--text-muted)}

    /* Bad Day toggle */
    .bad-day-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
    .bad-day-label{font-size:13px;font-weight:700;color:var(--text-soft)}
    .bad-day-sublabel{font-size:11px;color:var(--text-muted);margin-top:1px}
    .toggle-switch{width:44px;height:26px;border-radius:13px;background:rgba(0,0,0,.1);
      position:relative;cursor:pointer;transition:background .3s;border:none;flex-shrink:0}
    .toggle-switch.on{background:var(--accent)}
    .toggle-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;
      border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,.2);
      transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
    .toggle-switch.on .toggle-knob{transform:translateX(18px)}

    /* Mini sparks (bad day mode) */
    .mini-sparks{display:none;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
    .bad-day-mode .sparks-grid{display:none}
    .bad-day-mode .mini-sparks{display:grid}
    .mini-spark{padding:16px 12px;border-radius:14px;text-align:center;cursor:pointer;
      color:white;transition:all .2s;position:relative;overflow:hidden}
    .mini-spark::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;
      background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);pointer-events:none}
    .mini-spark:active{transform:scale(.95)}
    .mini-letter{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1}
    .mini-action{font-size:11px;margin-top:4px;opacity:.85;font-style:italic;line-height:1.3}
    .mini-spark.done{opacity:.65}
    .mini-spark.done::after{content:'✓';position:absolute;top:6px;right:8px;font-size:12px;font-weight:900}

    /* SPARK modal */
    #spark-modal{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
      align-items:center;justify-content:flex-end;
      background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
    #spark-modal.open{background:rgba(0,0,0,.5);pointer-events:all}
    .spark-sheet{width:100%;max-width:480px;
      background:linear-gradient(160deg,var(--bg-from),var(--bg-to));
      border-radius:28px 28px 0 0;padding:28px 20px calc(40px + var(--safe-bot));
      transform:translateY(110%);transition:transform .4s cubic-bezier(.34,1.2,.64,1);
      max-height:90dvh;overflow-y:auto}
    #spark-modal.open .spark-sheet{transform:translateY(0)}
    .spark-sheet::-webkit-scrollbar{display:none}
    .sheet-handle{width:40px;height:4px;background:rgba(0,0,0,.15);
      border-radius:2px;margin:0 auto 22px}
    .spark-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .spark-big-icon{width:64px;height:64px;border-radius:18px;display:flex;
      align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
    .spark-big-icon::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;
      background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);pointer-events:none}
    .spark-big-letter{font-family:'Cormorant Garamond',serif;font-size:36px;
      font-weight:600;color:white;position:relative;z-index:1}
    .spark-info h2{font-family:'Cormorant Garamond',serif;font-size:28px;
      font-weight:600;color:var(--accent)}
    .spark-info p{font-size:11px;color:var(--text-muted);font-weight:700;
      text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
    .close-sheet{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.08);
      border:none;width:32px;height:32px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:16px;color:var(--text-soft)}

    .idea-card{background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:16px;padding:16px 18px;margin-bottom:14px}
    .idea-text{font-family:'Cormorant Garamond',serif;font-size:22px;
      font-style:italic;color:var(--text);line-height:1.4;margin-bottom:12px}
    .idea-actions{display:flex;gap:8px}
    .btn-ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent);
      border-radius:99px;padding:6px 14px;font-family:'Nunito',sans-serif;
      font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-ghost:active{transform:scale(.96)}

    .custom-label{font-size:11px;font-weight:700;color:var(--text-muted);
      text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .custom-input{width:100%;background:var(--card-bg);border:1.5px solid rgba(0,0,0,.08);
      border-radius:12px;padding:12px 14px;font-family:'Nunito',sans-serif;
      font-size:14px;color:var(--text);outline:none;transition:border-color .2s;margin-bottom:16px}
    .custom-input:focus{border-color:var(--accent)}
    .custom-input::placeholder{color:var(--text-muted)}

    .btn-complete{width:100%;padding:16px;border-radius:16px;border:none;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;
      cursor:pointer;transition:all .2s;letter-spacing:.02em;
      box-shadow:0 4px 20px rgba(0,0,0,.2)}
    .btn-complete:active{transform:scale(.97)}
    .btn-complete.done-state{background:linear-gradient(135deg,#81c784,#4caf50)}

    /* Reading */
    .book-cards{display:flex;flex-direction:column;gap:12px}
    .book-card{display:flex;gap:14px;align-items:center;cursor:pointer;
      transition:transform .15s;padding:4px 0}
    .book-card:active{transform:scale(.98)}
    .book-cover{width:50px;height:68px;border-radius:6px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:24px;
      box-shadow:2px 3px 10px rgba(0,0,0,.12)}
    .book-meta{flex:1}
    .book-title{font-family:'Cormorant Garamond',serif;font-size:17px;
      font-weight:600;color:var(--text)}
    .book-author{font-size:12px;color:var(--text-muted);font-weight:600}
    .book-desc{font-size:12px;color:var(--text-soft);margin-top:3px;line-height:1.4}

    /* Book drawer */
    #book-drawer{position:fixed;inset:0;z-index:200;display:flex;
      flex-direction:column;align-items:center;justify-content:flex-end;
      background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
    #book-drawer.open{background:rgba(0,0,0,.5);pointer-events:all}
    .book-sheet{width:100%;max-width:480px;
      background:linear-gradient(160deg,var(--bg-from),var(--bg-to));
      border-radius:28px 28px 0 0;padding:28px 20px calc(40px + var(--safe-bot));
      transform:translateY(110%);transition:transform .4s cubic-bezier(.34,1.2,.64,1);
      max-height:82dvh;overflow-y:auto}
    #book-drawer.open .book-sheet{transform:translateY(0)}
    .book-sheet::-webkit-scrollbar{display:none}
    .quote-input{width:100%;background:var(--card-bg);border:1.5px solid rgba(0,0,0,.08);
      border-radius:12px;padding:12px 14px;font-family:'Cormorant Garamond',serif;
      font-size:16px;font-style:italic;color:var(--text);outline:none;
      resize:none;min-height:76px;transition:border-color .2s;margin-bottom:12px}
    .quote-input:focus{border-color:var(--accent)}
    .quote-input::placeholder{color:var(--text-muted)}

    .btn-primary{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;
      border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
      cursor:pointer;transition:all .2s;box-shadow:0 3px 12px rgba(0,0,0,.18)}
    .btn-primary:active{transform:scale(.96)}
    .btn-outline{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;
      border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;
      font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
      cursor:pointer;transition:all .2s}
    .btn-outline:active{transform:scale(.96)}

    /* Journal */
    .journal-textarea{width:100%;min-height:200px;background:transparent;
      border:none;outline:none;font-family:'Cormorant Garamond',serif;
      font-size:18px;color:var(--text);resize:none;line-height:1.7}
    .journal-textarea::placeholder{color:var(--text-muted);font-style:italic}
    .quote-item{padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06)}
    .quote-text{font-family:'Cormorant Garamond',serif;font-size:17px;
      font-style:italic;color:var(--text);line-height:1.5}
    .quote-source{font-size:11px;color:var(--text-muted);font-weight:700;margin-top:3px}

    /* Collection */
    .charm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:8px 0}
    .charm-item{display:flex;flex-direction:column;align-items:center;gap:5px;
      opacity:.2;transition:opacity .5s,transform .3s}
    .charm-item.unlocked{opacity:1}
    .charm-item.just-unlocked{animation:charmPop .5s cubic-bezier(.34,1.56,.64,1)}
    @keyframes charmPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
    .charm-name{font-size:9px;font-weight:700;color:var(--text-soft);
      text-align:center;letter-spacing:.06em;text-transform:uppercase}
    .charm-count{font-size:12px;font-weight:800;color:var(--accent)}

    .milestone-item{display:flex;align-items:center;gap:14px;padding:14px 0;
      border-bottom:1px solid rgba(0,0,0,.05);opacity:.3;transition:opacity .4s}
    .milestone-item.unlocked{opacity:1}
    .milestone-icon{font-size:32px;flex-shrink:0}
    .milestone-info{flex:1}
    .milestone-name{font-weight:700;font-size:14px;color:var(--text)}
    .milestone-req{font-size:11px;color:var(--text-muted)}

    .secret-item{display:flex;align-items:center;gap:14px;padding:12px 0;
      border-bottom:1px solid rgba(0,0,0,.05)}
    .secret-icon{font-size:28px;flex-shrink:0;opacity:.25;transition:opacity .4s}
    .secret-item.found .secret-icon{opacity:1}
    .secret-info{flex:1}
    .secret-name{font-size:13px;font-weight:700;color:var(--text-soft)}
    .secret-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
    .secret-hint{font-size:11px;color:var(--text-muted);font-style:italic}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat-box{background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:14px;padding:14px 10px;text-align:center}
    .stat-number{font-family:'Cormorant Garamond',serif;font-size:30px;
      font-weight:600;color:var(--accent);line-height:1}
    .stat-label{font-size:10px;font-weight:700;color:var(--text-muted);
      text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

    /* Archive */
    .archive-item{display:flex;align-items:center;gap:12px;padding:11px 0;
      border-bottom:1px solid rgba(0,0,0,.05)}
    .archive-date{font-size:11px;font-weight:700;color:var(--text-muted);min-width:72px}
    .archive-sparks{display:flex;gap:4px;flex-wrap:wrap}
    .archive-dot{width:10px;height:10px;border-radius:50%;opacity:.3}
    .archive-dot.done{opacity:1}
    .archive-mood{font-size:14px;margin-left:auto}

    /* Weekly scrapbook */
    .scrap-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .scrap-day{display:flex;flex-direction:column;align-items:center;gap:3px}
    .scrap-day-label{font-size:8px;font-weight:700;color:var(--text-muted);text-transform:uppercase}
    .scrap-dots{display:flex;flex-direction:column;gap:2px}
    .scrap-dot{width:8px;height:8px;border-radius:50%;opacity:.15}
    .scrap-dot.done{opacity:1}

    /* Me page */
    .theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .theme-option{border-radius:14px;padding:16px 10px;text-align:center;
      cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative}
    .theme-option.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,87,126,.2)}
    .theme-option.locked{opacity:.4;cursor:default}
    .theme-swatch{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;
      border:2px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .theme-name{font-size:11px;font-weight:700;color:var(--text-soft);
      text-transform:uppercase;letter-spacing:.06em}
    .lock-overlay{position:absolute;top:6px;right:8px;font-size:10px;opacity:.6}

    .world-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .world-option{border-radius:14px;padding:18px 14px;cursor:pointer;
      border:2px solid transparent;transition:all .2s;text-align:center;
      background:var(--card-bg);border-color:var(--card-border)}
    .world-option.selected{border-color:var(--accent)}
    .world-option:active{transform:scale(.97)}
    .world-emoji{font-size:26px;display:block;margin-bottom:5px}
    .world-name{font-size:12px;font-weight:700;color:var(--text-soft)}

    /* Toast */
    #toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);
      z-index:1000;display:flex;flex-direction:column;gap:8px;
      width:90%;max-width:380px;pointer-events:none;align-items:center}
    .toast{background:rgba(30,10,50,.92);backdrop-filter:blur(12px);
      color:white;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;
      animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
      border:1px solid rgba(255,255,255,.12);text-align:center;max-width:340px}
    @keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
    @keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px) scale(.95)}}

    /* Unlock modal */
    #unlock-modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;
      justify-content:center;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
    #unlock-modal.open{background:rgba(0,0,0,.72);pointer-events:all}
    .unlock-card{background:linear-gradient(160deg,var(--bg-from),var(--bg-to));
      border-radius:28px;padding:40px 28px;text-align:center;max-width:320px;width:90%;
      border:1px solid var(--card-border);box-shadow:0 20px 60px rgba(0,0,0,.3);
      transform:scale(.8);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
    #unlock-modal.open .unlock-card{transform:scale(1);opacity:1}
    .unlock-charm{margin:0 auto 16px;width:88px;height:88px;
      display:flex;align-items:center;justify-content:center}
    .unlock-category{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;
      letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    .unlock-name{font-family:'Cormorant Garamond',serif;font-size:28px;
      font-weight:600;color:var(--accent);margin-bottom:6px}
    .unlock-desc{font-size:13px;color:var(--text-soft);margin-bottom:24px;line-height:1.5}
    .btn-close-unlock{background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;border:none;border-radius:12px;padding:13px 36px;
      font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer}

    /* Confetti */
    .confetti-piece{position:fixed;width:7px;height:7px;pointer-events:none;z-index:400;
      animation:confettiFall 2.2s ease-in forwards}
    @keyframes confettiFall{
      0%{transform:translateY(-20px) rotate(0deg);opacity:1}
      100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

    /* Section headings */
    .section-header{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;margin-top:4px}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:22px;
      font-weight:600;color:var(--accent)}
    .section-count{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em}
    .screen-title{font-family:'Cormorant Garamond',serif;font-size:32px;
      font-weight:600;color:var(--accent);margin-bottom:4px}
    .screen-sub{font-size:12px;font-weight:600;color:var(--text-muted);
      letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent);margin:16px 0}

    .badge{display:inline-flex;align-items:center;gap:3px;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:#5a3800;font-size:10px;font-weight:800;
      padding:2px 8px;border-radius:20px}

    /* Read session timer */
    .timer-display{font-family:'Cormorant Garamond',serif;font-size:48px;
      font-weight:400;color:var(--accent);text-align:center;letter-spacing:.06em;margin:10px 0}
    .timer-label{font-size:11px;font-weight:700;color:var(--text-muted);
      text-align:center;text-transform:uppercase;letter-spacing:.1em}

    /* Empty states */
    .empty-state{text-align:center;padding:32px 20px;color:var(--text-muted);
      font-size:13px;font-style:italic;line-height:1.6}

    /* Divider */
    hr.soft{border:none;border-top:1px solid rgba(0,0,0,.06);margin:14px 0}
  </style>
</head>

// ── STATE ────────────────────────────────────────────────────────────────────

function todayKey() { return new Date().toISOString().slice(0,10); }
function dateKey(d) { return d.toISOString().slice(0,10); }
function formatDate(isoStr) {
  const d = new Date(isoStr + 'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

const DEFAULT_STATE = {
  today:{date:'',sparks:{},mood:null,intention:'',badDayMode:false},
  charms:{silence:0,pictures:0,affirmations:0,reading:0,kinetics:0,scribing:0},
  totalCharms:0, streak:0, lastCompletedDate:null, lastMilestone:-1,
  theme:'blush', world:'clouds', sound:false,
  quotes:[], journal:'', customActions:{},
  unlockedLoot:[], archive:[], tabTaps:0, currentIdxes:{},
  readingUnlocked:false
};

let STATE;

function loadState() {
  try {
    const raw = localStorage.getItem('sparksMorningClubState');
    if (!raw) return deepMerge(DEFAULT_STATE, {today:{date:todayKey()}});
    const s = JSON.parse(raw);
    if (s.today && s.today.date !== todayKey()) {
      const prev = s.today;
      if (prev.sparks && Object.values(prev.sparks).some(v=>v)) {
        const allDone = Object.values(prev.sparks).filter(Boolean).length === 6;
        s.archive = s.archive || [];
        s.archive.unshift({date:prev.date, sparks:{...prev.sparks},
          sparksCount:Object.values(prev.sparks).filter(Boolean).length,
          allDone, mood:prev.mood});
        if (s.archive.length > 60) s.archive.pop();
        if (allDone && !(s.unlockedLoot||[]).includes('week-artifact')) {
          s.unlockedLoot = [...(s.unlockedLoot||[]), 'week-artifact'];
        }
      }
      // Streak logic
      const yest = new Date(); yest.setDate(yest.getDate()-1);
      const yKey = dateKey(yest);
      const yestDone = (s.archive||[]).some(a=>a.date===yKey&&a.allDone);
      s.streak = yestDone ? (s.streak||0)+1 : 0;
      s.today = {date:todayKey(),sparks:{},mood:null,intention:'',badDayMode:false};
    }
    return deepMerge(DEFAULT_STATE, s);
  } catch { return deepMerge(DEFAULT_STATE, {today:{date:todayKey()}}); }
}

function deepMerge(base, over) {
  const r = {...base};
  for (const k in over) {
    if (over[k]!==null && typeof over[k]==='object' && !Array.isArray(over[k]))
      r[k] = deepMerge(base[k]||{}, over[k]);
    else r[k] = over[k];
  }
  return r;
}

function saveState() {
  localStorage.setItem('sparksMorningClubState', JSON.stringify(STATE));
}

// ── ROUTING ──────────────────────────────────────────────────────────────────

let currentScreen = 'today';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
  currentScreen = id;
  STATE.tabTaps = (STATE.tabTaps||0)+1;
  if (STATE.tabTaps>=22 && !STATE.unlockedLoot.includes('secret-sparkle')) {
    STATE.unlockedLoot.push('secret-sparkle');
    saveState();
    setTimeout(()=>showUnlock({category:'Secret',name:'Secret Sparkle',
      desc:'You tapped enough tabs to find it.',svgId:'secret-sparkle'}), 600);
  }
  saveState();
  switch(id) {
    case 'today':      renderToday();      break;
    case 'journal':    renderJournal();    break;
    case 'collection': renderCollection(); break;
    case 'read':       renderRead();       break;
    case 'me':         renderMe();         break;
  }
}

// ── RENDER: TODAY ─────────────────────────────────────────────────────────────

  else el.classList.remove('bad-day-mode');

  const coachArr = COACHING[coachKey];
  const coachMsg = coachArr[Math.floor((Date.now()/60000)%coachArr.length)];

  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  const nextSpark = SPARKS_DATA.find(s=>!STATE.today.sparks[s.id]);

  el.innerHTML = `
    <div class="today-header">
      <div class="today-date">${dateStr}</div>
      <div class="today-title">SPARKS</div>
      ${STATE.streak>1?`<div><span class="streak-badge">🔥 ${STATE.streak} day streak</span></div>`:''}

    <div class="card">
      <div class="card-sub">How are you arriving today?</div>
      <div class="mood-row">
        ${MOODS.map(m=>`

            ${m.emoji}<span>${m.label}</span>

      </div>
      <div class="coaching-note" id="coaching-note">${coachMsg}</div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="card-sub" style="margin-bottom:0">Today's SPARKS</div>
        <div class="badge">${done}/6</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${Math.round(done/6*100)}%"></div>
      </div>
      <div class="progress-label">${done===6?'Complete. The collection noticed.':done===0?'Tap a SPARK to begin.':done===5?'One left.':done+' of 6 done'}</div>
    </div>

    <!-- SPARKS grid -->
    <div class="sparks-grid">
      ${SPARKS_DATA.map(s=>`
        <div class="spark-tile ${STATE.today.sparks[s.id]?'done':''}"
          style="background:${s.gradient};box-shadow:0 6px 20px ${s.shadow}"
          onclick="openSparkModal('${s.id}')">
          <div class="spark-letter">${s.letter}</div>
          <div class="spark-name">${s.name}</div>
        </div>`).join('')}

    <!-- Mini sparks (bad day mode) -->
    <div class="mini-sparks">
      ${SPARKS_DATA.map(s=>`
        <div class="mini-spark ${STATE.today.sparks[s.id]?'done':''}"

          <div class="mini-letter">${s.letter}</div>
          <div class="mini-action">${s.badDayIdea}</div>
        </div>`).join('')}
    </div>

    <!-- Start where you left off -->
    ${nextSpark?`
    <div class="card" onclick="openSparkModal('${nextSpark.id}')">

function setMood(id) {
  STATE.today.mood = id;
  saveState();
  renderToday();
}

function saveIntention(val) {
  STATE.today.intention = val;
  saveState();
}

function toggleBadDay() {
  STATE.today.badDayMode = !STATE.today.badDayMode;
  if (STATE.today.badDayMode && !STATE.unlockedLoot.includes('three-brain-cells')) {
    STATE.unlockedLoot.push('three-brain-cells');
    saveState();
    setTimeout(()=>showUnlock({category:'Secret',name:'3 Brain Cells Badge',
      desc:'You activated Bad Day Mode.',svgId:'three-brain-cells'}),500);
  }
  saveState();
  renderToday();
}

// ── SPARK MODAL ───────────────────────────────────────────────────────────────

let activeSparkId = null;

function openSparkModal(id) {
  activeSparkId = id;
  const spark = SPARKS_DATA.find(s=>s.id===id);
  const isDone = STATE.today.sparks[id];
  const custom = STATE.customActions[id]||'';
  const ideas = spark.ideas;
  const idx = STATE.currentIdxes[id]||0;
  const currentIdea = ideas[idx % ideas.length];

  document.getElementById('spark-sheet-content').innerHTML = `
    <div class="sheet-handle"></div>
    <button class="close-sheet" onclick="closeSparkModal()">✕</button>
    <div class="spark-header">
      <div class="spark-big-icon" style="background:${spark.gradient}">
        <div class="spark-big-letter">${spark.letter}</div>
      </div>
      <div class="spark-info">
        <h2>${spark.name}</h2>
        <p>${spark.charm.name}</p>
      </div>
    </div>
    <div class="idea-card">
      <div class="idea-text" id="idea-text">"${currentIdea}"</div>
      <div class="idea-actions">
        <button class="btn-ghost" onclick="shuffleIdea('${id}')">↻ Shuffle</button>
      </div>
    </div>
    <div class="custom-label">Your own action</div>
    <input class="custom-input" id="custom-action-input" type="text"
      placeholder="Write your own version…"
      value="${custom}"
      oninput="saveCustomAction('${id}',this.value)">
    <button class="btn-complete ${isDone?'done-state':''}" id="complete-btn"
      onclick="completeSpark('${id}')">
      ${isDone?'✓ Done for today':'Complete '+spark.name}
    </button>
  `;

  const modal = document.getElementById('spark-modal');
  modal.classList.add('open');
  modal.addEventListener('click', modalBackdropClick);
}

function modalBackdropClick(e) {
  if (e.target === document.getElementById('spark-modal')) closeSparkModal();
}

function closeSparkModal() {
  document.getElementById('spark-modal').classList.remove('open');
  activeSparkId = null;
}

function shuffleIdea(id) {
  const spark = SPARKS_DATA.find(s=>s.id===id);
  const idx = ((STATE.currentIdxes[id]||0)+1) % spark.ideas.length;
  STATE.currentIdxes[id] = idx;
  saveState();
  const el = document.getElementById('idea-text');
  if (el) { el.style.opacity='0'; setTimeout(()=>{el.textContent='"'+spark.ideas[idx]+'"';el.style.opacity='1';el.style.transition='opacity .25s';},150); }
}

function saveCustomAction(id, val) {
  STATE.customActions[id] = val;
  saveState();
}

function completeSpark(id) {
  if (STATE.today.sparks[id]) { closeSparkModal(); return; }
  STATE.today.sparks[id] = true;
  const spark = SPARKS_DATA.find(s=>s.id===id);
  STATE.charms[id] = (STATE.charms[id]||0)+1;
  STATE.totalCharms = (STATE.totalCharms||0)+1;
  saveState();

  closeSparkModal();
  toast('✦ '+spark.charm.name+' acquired.');

  setTimeout(()=>{
    showUnlock({category:'SPARK Charm', name:spark.charm.name,
      desc:spark.charm.desc, svgId:spark.charm.id});
  }, 400);

  setTimeout(()=>checkMilestones(), 1800);

  // Check if all done
  const allDone = SPARKS_DATA.every(s=>STATE.today.sparks[s.id]);
  if (allDone) {
    STATE.streak = (STATE.streak||0) + (STATE.lastCompletedDate!==todayKey()?1:0);
    STATE.lastCompletedDate = todayKey();
    saveState();
    setTimeout(()=>toast('🎉 All six. The collection is pleased.'), 2200);
  }

  renderToday();
}

function checkMilestones() {
  const total = STATE.totalCharms;
  for (const m of MILESTONES) {
    if (total>=m.req && !STATE.unlockedLoot.includes(m.id)) {
      STATE.unlockedLoot.push(m.id);
      if (m.unlocksTheme) {
        toast('🔓 '+m.name+' — '+m.unlocksTheme.charAt(0).toUpperCase()+m.unlocksTheme.slice(1)+' Theme unlocked!');
      }
      saveState();
      setTimeout(()=>showUnlock({category:'Milestone',name:m.name,
        desc:m.desc,svgId:m.id}), 600);
      break;
    }
  }
}

        <button class="btn-complete" onclick="completeSpark('reading')">Complete Reading SPARK</button>
      </div>`:''}
      ${readDone?`<div style="margin-top:10px;text-align:center;color:var(--accent);font-weight:700;font-size:13px">✓ Reading done today.</div>`:''}
    </div>

    <div class="card">
      <div class="card-sub">A few books worth carrying</div>
      <div class="book-cards">
        ${BOOKS.map(b=>`
          <div class="book-card" onclick="openBookDrawer('${b.id}')">
            <div class="book-cover" style="background:${b.bg}">${b.emoji}</div>
            <div class="book-meta">
              <div class="book-title">${b.title}</div>
              <div class="book-author">${b.author}</div>
              <div class="book-desc">${b.desc}</div>
            </div>
            <div style="color:var(--text-muted);font-size:18px">›</div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function formatTimer(sec) {
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function toggleTimer() {
  if (readTimerRunning) {
    clearInterval(readTimer); readTimerRunning=false;
  } else {
    readTimerRunning=true;
    readTimer=setInterval(()=>{
      readSeconds++;
      const el=document.getElementById('read-timer');
      const lb=document.getElementById('timer-label');
      const tb=document.getElementById('timer-btn');
      if(el) el.textContent=formatTimer(readSeconds);
      if(lb) lb.textContent='Reading…';
      if(readSeconds===300){
        toast('⏱ 5 minutes done. Folded Book incoming.');
        renderRead();
      }
    },1000);
  }
  renderRead();
}

function resetTimer() {
  clearInterval(readTimer); readTimer=null; readTimerRunning=false; readSeconds=0;
  renderRead();
}

function openBookDrawer(id) {
  const book = BOOKS.find(b=>b.id===id);
  document.getElementById('book-sheet-content').innerHTML = `
    <div class="sheet-handle"></div>
    <button class="close-sheet" onclick="closeBookDrawer()">✕</button>
    <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:20px">
      <div class="book-cover" style="background:${book.bg};width:60px;height:84px;font-size:28px">${book.emoji}</div>
      <div>
        <div class="book-title" style="font-size:20px">${book.title}</div>
        <div class="book-author" style="margin-top:3px">${book.author}</div>
        <div class="book-desc" style="margin-top:6px">${book.desc}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-sub">A quote from this one</div>
      <div class="idea-text" style="font-size:18px">"${book.quote}"</div>
    </div>
    <div class="card-sub">Save a quote to journal</div>
    <textarea class="quote-input" id="drawer-quote-input"
      placeholder="Write or paste a quote…"></textarea>
    <div style="display:flex;gap:10px">
      <button class="btn-primary" onclick="saveQuote('${id}')">Save quote</button>
      <button class="btn-outline" onclick="useDefaultQuote('${id}')">Use theirs</button>
    </div>
  `;
  document.getElementById('book-drawer').classList.add('open');
  document.getElementById('book-drawer').addEventListener('click', bookBackdropClick);
}

function bookBackdropClick(e) {
  if (e.target===document.getElementById('book-drawer')) closeBookDrawer();
}
function closeBookDrawer() { document.getElementById('book-drawer').classList.remove('open'); }

function useDefaultQuote(bookId) {
  const book = BOOKS.find(b=>b.id===bookId);
  const el=document.getElementById('drawer-quote-input');
  if(el) el.value=book.quote;
}

function saveQuote(bookId) {
  const el=document.getElementById('drawer-quote-input');
  const text=(el?el.value:'').trim();
  if(!text) return;
  const book=BOOKS.find(b=>b.id===bookId);
  STATE.quotes.unshift({text, source:book.title+' — '+book.author, date:todayKey()});
  if(STATE.quotes.length>50) STATE.quotes.pop();
  saveState();
  toast('📌 Quote saved to journal.');
  closeBookDrawer();
}

// ── RENDER: JOURNAL ───────────────────────────────────────────────────────────

function renderJournal() {
  const el = document.getElementById('screen-journal');
  el.innerHTML = `
    <div class="screen-title">Journal</div>
    <div class="screen-sub">Just write.</div>

    <div class="card">
      <textarea class="journal-textarea" id="journal-area"
        placeholder="Anything. What you noticed. How you feel. What happened. One sentence or ten pages."
        oninput="saveJournal(this.value)">${STATE.journal||''}</textarea>
    </div>

    ${STATE.quotes.length?`
    <div class="section-header">
      <div class="section-title">Saved Quotes</div>
      <div class="section-count">${STATE.quotes.length}</div>
    </div>
    <div class="card">
      ${STATE.quotes.map((q,i)=>`
        <div class="quote-item">
          <div class="quote-text">"${q.text}"</div>
          <div class="quote-source">${q.source}${q.date?' · '+formatDate(q.date):''}</div>
        </div>`).join('')}
    </div>`:
    `<div class="empty-state">Quotes saved from the Reading page will appear here.</div>`}
  `;
}

function saveJournal(val) { STATE.journal=val; saveState(); }

// ── RENDER: COLLECTION ────────────────────────────────────────────────────────

function renderCollection() {
  const el = document.getElementById('screen-collection');
  const sparkColors = {silence:'#9c7fcf',pictures:'#e8799a',affirmations:'#ff8c69',
    reading:'#6eb892',kinetics:'#6aaee0',scribing:'#d4a843'};

  el.innerHTML = `
    <div class="screen-title">Collection</div>
    <div class="screen-sub">${STATE.totalCharms} charm${STATE.totalCharms!==1?'s':''} total</div>

    <!-- Stats -->
    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-box"><div class="stat-number">${STATE.totalCharms}</div><div class="stat-label">Charms</div></div>
      <div class="stat-box"><div class="stat-number">${STATE.streak||0}</div><div class="stat-label">Streak</div></div>
      <div class="stat-box"><div class="stat-number">${(STATE.archive||[]).filter(a=>a.allDone).length}</div><div class="stat-label">Full days</div></div>
    </div>

    <!-- SPARK Charms -->
    <div class="section-header">
      <div class="section-title">SPARK Charms</div>
    </div>
    <div class="card">
      <div class="charm-grid">
        ${SPARKS_DATA.map(s=>{
          const count=STATE.charms[s.id]||0;
          return `<div class="charm-item ${count>0?'unlocked':''}">
            ${charmSVG(s.charm.id,56)}
            <div class="charm-name">${s.charm.name}</div>
            ${count>0?`<div class="charm-count">×${count}</div>`:'<div class="charm-count" style="opacity:.3">—</div>'}
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Milestones -->
    <div class="section-header">
      <div class="section-title">Milestones</div>
    </div>
    <div class="card">
      ${MILESTONES.map(m=>`
        <div class="milestone-item ${STATE.unlockedLoot.includes(m.id)?'unlocked':''}">
          <div class="milestone-icon">${charmSVG(m.id,40)}</div>
          <div class="milestone-info">
            <div class="milestone-name">${m.name}</div>
            <div class="milestone-req">${STATE.unlockedLoot.includes(m.id)?'Unlocked':'Reach '+m.req+' total charms'}</div>
          </div>
          ${STATE.unlockedLoot.includes(m.id)?'<div style="color:var(--gold);font-size:16px">✦</div>':''}
        </div>`).join('')}
    </div>

    <!-- Secrets -->
    <div class="section-header">
      <div class="section-title">Secrets</div>
    </div>
    <div class="card">
      ${SECRETS.map(s=>`
        <div class="secret-item ${STATE.unlockedLoot.includes(s.id)?'found':''}">
          <div class="secret-icon">${charmSVG(s.id,36)}</div>
          <div class="secret-info">
            ${STATE.unlockedLoot.includes(s.id)?
              `<div class="secret-name">${s.name}</div><div class="secret-desc">${s.desc}</div>`:
              `<div class="secret-name">???</div><div class="secret-hint">${s.hint}</div>`}
          </div>
          ${STATE.unlockedLoot.includes(s.id)?'<div style="color:var(--gold);font-size:16px">✦</div>':''}
        </div>`).join('')}
    </div>

    <!-- Weekly scrapbook -->
    <div class="section-header">
      <div class="section-title">This Week</div>
    </div>
    <div class="card">
      ${renderScrapbook()}
    </div>

    <!-- Archive -->
    ${(STATE.archive||[]).length?`
    <div class="section-header">
      <div class="section-title">Archive</div>
      <div class="section-count">last ${Math.min(STATE.archive.length,14)} days</div>
    </div>
    <div class="card">
      ${(STATE.archive||[]).slice(0,14).map(a=>`
        <div class="archive-item">
          <div class="archive-date">${formatDate(a.date)}</div>
          <div class="archive-sparks">
            ${SPARKS_DATA.map(s=>`
              <div class="archive-dot ${a.sparks[s.id]?'done':''}"
                style="background:${sparkColors[s.id]}"></div>`).join('')}
          </div>
          ${a.mood?`<div class="archive-mood">${MOODS.find(m=>m.id===a.mood)?.emoji||''}</div>`:''}
        </div>`).join('')}
    </div>`:''}
  `;
}

function renderScrapbook() {
  const sparkColors = {silence:'#9c7fcf',pictures:'#e8799a',affirmations:'#ff8c69',
    reading:'#6eb892',kinetics:'#6aaee0',scribing:'#d4a843'};
  const days=[];
  const today=new Date();
  for(let i=6;i>=0;i--) {
    const d=new Date(today); d.setDate(d.getDate()-i);
    const key=dateKey(d);
    const dayLabel=['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
    const isToday=key===todayKey();
    let sparks={};
    if(isToday) sparks=STATE.today.sparks;
    else { const arch=(STATE.archive||[]).find(a=>a.date===key); sparks=arch?arch.sparks:{}; }
    days.push({key,dayLabel,sparks,isToday});
  }
  return `<div class="scrap-week">
    ${days.map(d=>`
      <div class="scrap-day">
        <div class="scrap-day-label" style="${d.isToday?'color:var(--accent);font-weight:800':''}">${d.dayLabel}</div>
        <div class="scrap-dots">
          ${SPARKS_DATA.map(s=>`
            <div class="scrap-dot ${d.sparks[s.id]?'done':''}"
              style="background:${sparkColors[s.id]}"></div>`).join('')}
        </div>
      </div>`).join('')}
  </div>`;
}

// ── RENDER: ME ────────────────────────────────────────────────────────────────

function renderMe() {
  const el = document.getElementById('screen-me');
  el.innerHTML = `
    <div class="screen-title">Me</div>
    <div class="screen-sub">Make it yours.</div>

    <!-- Themes -->
    <div class="card">
      <div class="card-sub">Theme</div>
      <div class="theme-options">
        ${THEMES.map(t=>{
          const isLocked=t.locked&&!STATE.unlockedLoot.some(l=>{
            const m=MILESTONES.find(mi=>mi.unlocksTheme===t.id); return m&&STATE.unlockedLoot.includes(m.id);
          });
          return `<div class="theme-option ${STATE.theme===t.id?'selected':''} ${isLocked?'locked':''}"
            onclick="${isLocked?`toast('🔒 Unlock at ${MILESTONES.find(m=>m.unlocksTheme===t.id)?.req||'?'} charms.')`:``}setTheme('${t.id}')">
            <div class="theme-swatch" style="background:${t.swatch}"></div>
            <div class="theme-name">${t.name}</div>
            ${isLocked?`<div class="lock-overlay">🔒</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Worlds -->
    <div class="card">
      <div class="card-sub">Tiny World</div>
      <div class="world-options">
        ${WORLDS.map(w=>`
          <div class="world-option ${STATE.world===w.id?'selected':''}"
            onclick="setWorld('${w.id}')">
            <span class="world-emoji">${w.emoji}</span>
            <div class="world-name">${w.name}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- Sound -->
    <div class="card">
      <div class="bad-day-toggle">
        <div>
          <div class="bad-day-label">Sound</div>
          <div class="bad-day-sublabel">Off by default. Coming soon.</div>
        </div>
        <button class="toggle-switch ${STATE.sound?'on':''}" onclick="toggleSound()">
          <div class="toggle-knob"></div>
        </button>
      </div>
    </div>

    <!-- About -->
    <div class="card">
      <div class="card-sub">About</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--accent);margin-bottom:8px">SPARKS Morning Club</div>
      <div style="font-size:13px;color:var(--text-soft);line-height:1.6">
        A premium collectible morning ritual. Six tiny actions. Real unlockables.
        No wellness-app voice. Data stays on your device.
      </div>
      <div class="divider"></div>
      <div style="font-size:11px;color:var(--text-muted)">
        Total charms: ${STATE.totalCharms} &nbsp;·&nbsp; Items unlocked: ${STATE.unlockedLoot.length}
      </div>
      <div style="margin-top:12px">
        <button class="btn-ghost" onclick="if(confirm('Reset all progress? This cannot be undone.')){localStorage.removeItem('sparksMorningClubState');location.reload()}">
          Reset everything
        </button>
      </div>
    </div>
  `;
}

function setTheme(id) {
  const t=THEMES.find(t=>t.id===id);
  if(!t) return;
  if(t.locked) {
    const m=MILESTONES.find(mi=>mi.unlocksTheme===id);
    if(m&&!STATE.unlockedLoot.includes(m.id)) { toast('🔒 Reach '+m.req+' charms to unlock.'); return; }
  }
  STATE.theme=id;
  saveState();
  applyTheme();
  renderMe();
}

function setWorld(id) {
  STATE.world=id;
  saveState();
  applyWorld();
  renderMe();
}

function toggleSound() {
  STATE.sound=!STATE.sound;
  saveState();
  toast(STATE.sound?'🔊 Sound on. (Sounds coming soon.)':'🔇 Sound off.');
  renderMe();
}

function applyTheme() {
  document.body.classList.remove('theme-blush','theme-lavender','theme-vegas');
  if(STATE.theme!=='blush') document.body.classList.add('theme-'+STATE.theme);
}

function applyWorld() {
  document.body.classList.remove('world-clouds','world-stars','world-sunrise','world-garden','world-cosmic');
  document.body.classList.add('world-'+STATE.world);
}

// ── UNLOCK MODAL ──────────────────────────────────────────────────────────────

let unlockQueue = [];
let unlockShowing = false;

function showUnlock(data) {
  unlockQueue.push(data);
  if (!unlockShowing) processUnlockQueue();
}

function processUnlockQueue() {
  if (!unlockQueue.length) { unlockShowing=false; return; }
  unlockShowing=true;
  const data=unlockQueue.shift();
  const modal=document.getElementById('unlock-modal');
  document.getElementById('unlock-card-content').innerHTML = `
    <div class="unlock-charm">${charmSVG(data.svgId,88)}</div>
    <div class="unlock-category">${data.category||'Unlocked'}</div>
    <div class="unlock-name">${data.name}</div>
    <div class="unlock-desc">${data.desc}</div>
    <button class="btn-close-unlock" onclick="closeUnlock()">Nice.</button>
  `;
  modal.classList.add('open');
  spawnConfetti();
}

function closeUnlock() {
  document.getElementById('unlock-modal').classList.remove('open');
  setTimeout(processUnlockQueue, 400);
}

function spawnConfetti() {
  const colors=['#f8bbd0','#e1bee7','#d4a843','#6aaee0','#94d0ac','#ff9db5','#b89ae8'];
  for(let i=0;i<28;i++) {
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};
      border-radius:${Math.random()>0.5?'50%':'2px'};
      animation-duration:${1.5+Math.random()*1.2}s;
      animation-delay:${Math.random()*0.5}s;
      transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3000);
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

function toast(msg) {
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────

STATE = loadState();
applyTheme();
applyWorld();

document.getElementById('nav').addEventListener('click', e=>{
  const btn=e.target.closest('.nav-btn');
  if(btn&&btn.dataset.screen) showScreen(btn.dataset.screen);
});

document.getElementById('spark-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('spark-modal')) closeSparkModal();
});
document.getElementById('book-drawer').addEventListener('click', e=>{
  if(e.target===document.getElementById('book-drawer')) closeBookDrawer();
});
document.getElementById('unlock-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('unlock-modal')) closeUnlock();
});

renderToday();
</script>
</body>
</html>
